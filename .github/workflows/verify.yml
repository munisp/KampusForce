name: Verify KampusForce

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: kampusforce-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kampusforce
          POSTGRES_PASSWORD: kampusforce_test
          POSTGRES_DB: kampusforce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kampusforce -d kampusforce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://kampusforce:kampusforce_test@localhost:5432/kampusforce_test
      NODE_ENV: test
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      PHONE_HASH_SALT: ci-only-phone-salt-not-for-production
      VENDOR_WEBHOOK_SECRETS: "{}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python3 -m pip install -r data_platform/requirements.txt
      - run: python3 data_platform/acceptance.py --output /tmp/kampusforce-data-platform-acceptance
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npx tsx scripts/verify-phase2.ts
      - run: npx tsx scripts/verify-phase3.ts
      - run: npx tsx scripts/verify-phase4.ts
      - run: npx tsx scripts/verify-phase5.ts
      - run: npx tsx scripts/verify-phase6.ts
      - run: npx tsx scripts/verify-phase7.ts
      - run: npx tsx scripts/verify-phase8.ts
      - run: npx tsx scripts/verify-phase9.ts
      - run: npx tsx scripts/verify-phase10.ts
      - run: npx tsx scripts/verify-phase11.ts
      - run: npx tsx scripts/verify-phase12.ts
      - run: npx tsx scripts/record-data-platform-evidence.ts /tmp/kampusforce-data-platform-acceptance/run_manifest.json /tmp/kampusforce-data-platform-acceptance/ray_manifest.json
      - run: npx tsx scripts/verify-phase13.ts
      - run: npx tsx scripts/verify-phase14.ts
      - run: npx tsx scripts/verify-phase15.ts
      - run: npx tsx scripts/verify-phase16.ts
      - name: Verify non-destructive backup and isolated restore
        run: |
          npm run db:backup -- /tmp/kampusforce-ci-recovery.dump
          KF_RECOVERY_DRILL=sandbox npm run db:verify-restore -- /tmp/kampusforce-ci-recovery.dump
      - run: npm audit --omit=dev
      - name: Install browser acceptance runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify all Phase 17 workflows with real platform object storage
        if: ${{ vars.KF_PHASE17_STORAGE_ACCEPTANCE == 'true' }}
        env:
          KIMI_AGENTGW_BASE_URL: ${{ vars.KIMI_AGENTGW_BASE_URL }}
          KIMI_AGENTGW_API_KEY: ${{ secrets.KIMI_AGENTGW_API_KEY }}
          KIMI_STORAGE_RESOURCE_ID: ${{ vars.KIMI_STORAGE_RESOURCE_ID }}
        run: npx tsx scripts/verify-phase17.ts
      - name: Verify Phase 18 ATS, campaign, capacity and document workflows with real platform object storage
        if: ${{ vars.KF_PHASE17_STORAGE_ACCEPTANCE == 'true' }}
        env:
          KIMI_AGENTGW_BASE_URL: ${{ vars.KIMI_AGENTGW_BASE_URL }}
          KIMI_AGENTGW_API_KEY: ${{ secrets.KIMI_AGENTGW_API_KEY }}
          KIMI_STORAGE_RESOURCE_ID: ${{ vars.KIMI_STORAGE_RESOURCE_ID }}
        run: npx tsx scripts/verify-phase18.ts
      - name: Verify Phase 19 institutional, document, connector and recurrence workflows with real platform object storage
        if: ${{ vars.KF_PHASE17_STORAGE_ACCEPTANCE == 'true' }}
        env:
          KIMI_AGENTGW_BASE_URL: ${{ vars.KIMI_AGENTGW_BASE_URL }}
          KIMI_AGENTGW_API_KEY: ${{ secrets.KIMI_AGENTGW_API_KEY }}
          KIMI_STORAGE_RESOURCE_ID: ${{ vars.KIMI_STORAGE_RESOURCE_ID }}
        run: npx tsx scripts/verify-phase19.ts
      - name: Start production server
        run: |
          KF_TALENT_PROCESSOR_MODE=fixture npm start > /tmp/kampusforce-ci-server.log 2>&1 &
          echo $! > /tmp/kampusforce-ci-server.pid
      - name: Verify Phase 16 through Phase 19 production browser and mobile journeys
        env:
          KF_BROWSER_BASE_URL: http://127.0.0.1:3000
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready > /tmp/kampusforce-ci-ready.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health/ready
          python3 scripts/verify-phase16-browser.py
          python3 scripts/verify-phase17-browser.py
          python3 scripts/verify-phase18-browser.py
          python3 scripts/verify-phase19-browser.py
